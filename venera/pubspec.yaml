name: venera
description: "A comic app."
publish_to: 'none'

version: 1.7.1+171

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: any
  intl: any
  window_manager: ^0.5.1
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.30
  flutter_qjs:
    git:
      url: https://github.com/venera-app/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  crypto: ^3.0.6
  dio: ^5.9.2
  html: ^0.15.6
  pointycastle: ^4.0.0
  url_launcher: ^6.3.2
  path: ^1.9.0
  photo_view:
    git:
      url: https://github.com/venera-app/photo_view
      ref: a1255d1b5945aad4b7323303ec2ecdf0c90ffc4c
  mime: ^1.0.4
  share_plus: ^12.0.1
  scrollable_positioned_list:
    git:
      url: https://github.com/venera-app/flutter.widgets
      ref: 09e756b1f1b04e6298318d99ec20a787fb360f59
      path: packages/scrollable_positioned_list
  flutter_reorderable_grid_view: ^5.4.0
  uuid: ^4.5.1
  desktop_webview_window:
    git:
      url: https://github.com/venera-app/flutter_desktop_webview
      path: packages/desktop_webview_window
      ref: 7801fc582ecf5a7351632887891ecf309a7b2583
  flutter_inappwebview:
    git:
      url: https://github.com/venera-app/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b3db57c911b080979f1392253b835f98ab
  app_links: ^6.4.1
  sliver_tools: ^0.2.12
  flutter_file_dialog: ^3.0.3
  file_selector: ^1.1.0
  zip_flutter: ^0.0.13
  lodepng_flutter:
    git:
      url: https://github.com/venera-app/lodepng_flutter
      ref: ac7d05dde32e8d728102a9ff66e6b55f05d94ba1
  rhttp: ^0.15.1
  webdav_client:
    git:
      url: https://github.com/venera-app/webdav_client
      ref: 2f669c98fb81cff1c64fee93466a1475c77e4273
  battery_plus: ^7.0.0
  local_auth: ^3.0.1
  flutter_saf:
    git: 
      url: https://github.com/venera-app/flutter_saf
      ref: fe182cdf40e5fa6230f451bc1d643b860f610d13
  dynamic_color: ^1.8.1
  shimmer_animation: ^2.1.0
  flutter_memory_info: ^0.0.3
  syntax_highlight: ^0.4.0
  flutter_7zip:
    git:
      url: https://github.com/venera-app/flutter_7zip
      ref: b33344797f1d2469339e0e1b75f5f954f1da224c
  flex_seed_scheme: any
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.3
  enough_convert: ^1.6.0
  display_mode: ^0.0.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_to_arch: ^1.0.1
  flutter_to_debian: 
    git:
      url: https://github.com/venera-app/flutter_to_debian.git
  archive: any

flutter:
  uses-material-design: true
  assets:
    - assets/translation.json
    - assets/init.js
    - assets/app_icon.png
    - assets/tags.json
    - assets/tags_tw.json
    - assets/opencc.txt
# fonts:

flutter_to_arch:
  name: Venera
  icon: debian/gui/venera.png
  categories: Utility
  keywords: Flutter;comic;images;
  url: https://github.com/Leif-Wang-021/venera
  depends:
    - gtk3
    - webkit2gtk-4.1

dependency_overrides:
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
  file_selector:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/file_selector/file_selector
  share_plus:
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
      ref: br_share_plus-v10.1.1_ohos
  flutter_inappwebview:
    path: ohos_plugins/flutter_inappwebview/flutter_inappwebview
  flutter_qjs:
    path: ohos_plugins/flutter_qjs
  url_launcher:
    path: ohos_plugins/url_launcher/url_launcher
  local_auth:
    path: ohos_plugins/local_auth/local_auth
  intl:
    hosted: https://pub.dev
    version: 0.20.2
  lodepng_flutter:
    path: ohos_plugins/lodepng_flutter
  flutter_7zip:
    path: ohos_plugins/flutter_7zip
  zip_flutter:
    path: ohos_plugins/zip_flutter
  app_links:
    path: ohos_plugins/app_links
  flutter_memory_info:
    path: ohos_plugins/flutter_memory_info
  flutter_file_dialog:
    path: ohos_plugins/flutter_file_dialog
  display_mode:
    path: ohos_plugins/display_mode
  flutter_saf:
    path: ohos_plugins/flutter_saf
